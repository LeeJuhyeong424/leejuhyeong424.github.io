# 사이트 설정 파일

# 사용할 테마 불러오기
theme: jekyll-theme-chirpy

# 웹페이지 언어 › http://www.lingoes.net/en/translator/langcode.htm
# `_data/locales` 폴더 안의 파일 이름과 같으면 레이아웃 언어도 그 언어로 바뀌고,
# 그렇지 않으면 레이아웃 언어는 기본값인 'en'을 사용합니다.
lang: ko-KR

# 사용할 시간대로 변경하세요 › https://zones.arilyn.cc
timezone: Asia/Seoul

# jekyll-seo-tag 설정 › https://github.com/jekyll/jekyll-seo-tag/blob/master/docs/usage.md
# ↓ --------------------------

title: 쭈꾸미블로그 # 사이트 메인 제목

tagline: 개발 기록 아카이빙 블로그 # 부제목으로 표시됨

description: >- # SEO 메타 태그와 Atom 피드에 사용됨
  각종 개발 관련 메모 및 기록을 남기는 아카이빙 블로그 입니다.

# 사이트의 프로토콜과 호스트명을 입력하세요.
# 예: 'https://username.github.io' (끝에 '/'를 붙이지 않습니다)
url: "https://leejuhyeong.pe.kr"

github:
  username: LeeJuhyeong424 # 본인 GitHub 사용자명으로 변경

# twitter:
  # username: twitter_username # 본인 Twitter 사용자명으로 변경

social:
  # 본인 이름(전체 이름)으로 변경하세요.
  # 게시글의 기본 작성자와 푸터의 저작권자로 표시됩니다.
  name: chosinong
  email: poorruralfarmers@gmail.com # 본인 이메일 주소로 변경
  fediverse_handle: # 페디버스 핸들 입력. 예: "@username@domain.com"
  links:
    # 첫 번째 항목은 저작권자 링크로 사용됩니다
    # - https://twitter.com/username # 본인 Twitter 주소로 변경
    - https://github.com/LeeJuhyeong424 # 본인 GitHub 주소로 변경
    # 아래 주석을 해제하면 소셜 링크를 더 추가할 수 있습니다
    # - https://www.facebook.com/username
    # - https://www.linkedin.com/in/username

# 사이트 소유 확인(검색엔진 인증) 설정
webmaster_verifications:
  google: # Google 인증 코드 입력
  bing: # Bing 인증 코드 입력
  alexa: # Alexa 인증 코드 입력
  yandex: # Yandex 인증 코드 입력
  baidu: # Baidu 인증 코드 입력
  facebook: # Facebook 인증 코드 입력

# ↑ --------------------------
# `jekyll-seo-tag` 설정 끝

# 웹 분석(방문자 통계) 설정
analytics:
  google:
    id: # Google Analytics ID 입력
  goatcounter:
    id: # GoatCounter ID 입력
  umami:
    id: # Umami ID 입력
    domain: # Umami 도메인 입력
  matomo:
    id: # Matomo ID 입력
    domain: # Matomo 도메인 입력
  cloudflare:
    id: # Cloudflare Web Analytics 토큰 입력
  fathom:
    id: # Fathom Site ID 입력

# 페이지 조회수 설정
pageviews:
  provider: # 현재 'goatcounter'만 지원

# 선호 색상 모드 설정
#
# 참고: 비워 두면 기본적으로 시스템 색상 설정을 따르며,
# 사이드바 왼쪽 아래에 라이트/다크 모드 전환 버튼이 생깁니다.
#
# 사용 가능한 옵션:
#
#     light — 라이트 모드 사용
#     dark — 다크 모드 사용
#
theme_mode: # [light | dark]

# 미디어 리소스용 CDN 주소
# 값을 지정하면 '/'로 시작하는 모든 미디어 리소스 경로
# (사이트 아바타, 게시글 이미지, 오디오·비디오 파일) 앞에 CDN 주소가 붙습니다.
#
# 예: 'https://cdn.com'
cdn:

# 사이드바의 아바타 이미지 (로컬 파일 또는 CORS 허용 리소스 지원)
avatar:

# SEO `og:image` 메타 태그에 쓰이는 사이트 전체 소셜 미리보기 이미지 URL
# 게시글 front matter의 `page.image`로 개별 지정하면 덮어씁니다.
social_preview_image: # 문자열, 로컬 또는 CORS 리소스

# boolean 값, 게시글 목차(TOC) 전체 on/off 스위치
toc: true

actions:
  # 각 게시글 페이지에 "이 글 수정하기" 버튼을 표시해 기여를 유도합니다.
  edit_post:
    enabled: true # true로 설정하면 "이 글 수정하기" 버튼 표시
    url: "https://github.com/LeeJuhyeong424/leejuhyeong424.github.io/edit/main" # 저장소 기본 URL, 예: https://github.com/cotes2020/jekyll-theme-chirpy/edit/master
    # 수정 링크를 동적 URL로 쓸지 정적 URL로 쓸지 선택합니다.
    # `static_url`이 false면 위 `url` 뒤에 게시글 경로가 붙어 최종 수정 링크가 됩니다.
    # true면 URL이 그대로 유지되어 모든 게시글이 같은 수정 링크를 공유합니다.
    static_url: false # [ true | false ]

comments:
  # 게시글 댓글 시스템 전체 스위치. 비워 두면 비활성화됩니다.
  provider: # [disqus | utterances | giscus]
  # 각 댓글 서비스별 옵션은 아래와 같습니다:
  disqus:
    shortname: # Disqus shortname 입력 › https://help.disqus.com/en/articles/1717111-what-s-a-shortname
  # utterances 설정 › https://utteranc.es/
  utterances:
    repo: # <GitHub 사용자명>/<저장소명>
    issue_term: # < url | pathname | title | ...>
  # Giscus 옵션 › https://giscus.app
  giscus:
    repo: # <GitHub 사용자명>/<저장소명>
    repo_id:
    category:
    category_id:
    mapping: # 선택 사항, 기본값 'pathname'
    strict: # 선택 사항, 기본값 '0'
    input_position: # 선택 사항, 기본값 'bottom'
    lang: # 선택 사항, 기본값은 `site.lang` 값
    reactions_enabled: # 선택 사항, 기본값 `1`

# 정적 에셋 직접 호스팅(선택 사항) › https://github.com/cotes2020/chirpy-static-assets
assets:
  self_host:
    enabled: # boolean, 비워 두면 false
    # 적용할 Jekyll 환경 지정, 비워 두면 둘 다 적용
    # `assets.self_host.enabled`가 'true'일 때만 동작
    env: # [development | production]

pwa:
  enabled: true # PWA 기능(앱처럼 설치 가능) 사용 여부
  cache:
    enabled: true # PWA 오프라인 캐시 사용 여부
    # 여기에 지정한 경로는 PWA 캐시에서 제외됩니다.
    # 보통 현재 사이트와 같은 도메인을 공유하는
    # 다른 웹사이트의 `baseurl` 값을 넣습니다.
    deny_paths:
      # - "/example"  # `<SITE_URL>/example/*`에 해당하는 URL은 PWA 캐시에 저장되지 않음

paginate: 10

# 사이트의 기본 URL 경로
baseurl: ""

# ------------ 아래 옵션들은 수정하지 않는 것을 권장합니다 ------------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts: # Rouge 옵션 › https://github.com/jneen/rouge#full-options
    css_class: highlight
    # default_lang: console
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: "" # 빈 문자열은 프로젝트 내 모든 파일을 의미
      type: posts
    values:
      layout: post
      comments: true # 게시글에 댓글 표시
      toc: true # 게시글에 목차(TOC) 열 표시
      # 프로젝트 내 다른 모든 게시글 링크 코드를 직접 수정할 자신이 없다면
      # 아래 파라미터는 수정하지 마세요.
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs # `site.collections` 참고
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
